        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # SYMMETRIC-CUT stage 2, real cohort: same slope model + real panel, but frozen against the
  # symmetric prefit (both cohorts censored at onset in stage 1). Pairs with the _placebo_sym
  # run for the calibrated hazard contrast (real minus placebo on the same instrument).
  nba_convex_max_tvrflvm_AR_injury_causal_slope_sym:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
