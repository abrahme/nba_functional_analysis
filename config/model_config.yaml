  # Stage 2 calibration: same machinery, pseudo-onsets on never-injured players. Effects here
  # should straddle zero; anything else means the pipeline manufactures signal.
  nba_convex_max_tvrflvm_AR_athl_injury_causal_ct_placebo_sym:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    age_min: 18
    age_max: 45
    # start_year pinned to 1997 (NOT ~ as in the box-score suite): play-by-play does not exist
    # before that, so earlier rows carry no athleticism data. The prefit and the injury run MUST
    # share this window -- the cut freezes X by position, so a differing player set breaks it.
    start_year: 1997
    end_year: 2025
    map_num_steps: 50000
    num_warmup: 2000
    injury: true
    injury_data_csv: data/athleticism_panel_placebo.csv
