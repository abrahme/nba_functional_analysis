      mcmc:
        # mcmc_init MUST be median here, not map. `init_path` is the injury-free PREFIT, so a
        # map init supplies only 2 of the 10 free sites and the 8 injury sites fall through to
        # init_to_uniform; on the continuous-time path the chains then never move (within-chain
        # SD ~1e-6, R-hat ~1e5 -- a "posterior" that is just its initialisation). Measured:
        # switching to init_to_median raises within-chain SD from ~1e-6 to ~5e-2 on every injury
        # site. Fixed plug-ins still load from fixed_param_path, so the cut is unchanged.
        # The slope_* entries share the map+prefit pattern but do sample, so this is specific to
        # the use_injury_continuous/use_injury_decay path.
        mcmc_init: median
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_injury_causal_ct_placebo_sym/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal_sym_v2/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal_sym_v2/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # Slope-only ablation: pure-acceleration reading (level term zeroed out of mu).
  nba_convex_max_tvrflvm_AR_injury_causal_slope_only:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      use_injury_slope_only: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_injury_causal_slope_only/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_injury_causal_slope_only/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # Placebo validation: same slope model, same cut, but on the PLACEBO panel — real injuries
  # stripped, pseudo-onsets assigned to age-matched never-injured players (see
  # data_causal/make_placebo_injury_csv.py). Recovered effects should be ~= 0; systematic nonzero
  # posteriors here mean the pipeline/priors manufacture signal. Run AFTER regenerating the panel.
  nba_convex_max_tvrflvm_AR_injury_causal_slope_placebo:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    injury_data_csv: data/injury_player_cleaned_placebo.csv
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_injury_causal_slope_placebo/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_injury_causal_slope_placebo/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # ── NaiveLinearLVM (AR(1) per player per metric, no latent factors) ──────────
  nba_naive:
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_naive/map
      mcmc:
        model_dir:        model_output/nba_naive/mcmc
        init_path:        model_output/nba_naive/map/samples.pkl
        fixed_param_path: model_output/nba_naive/map/samples.pkl
        fixed_params: []
        thinning: 250

  nba_naive_holdout_last_k:
    model_dir: model_output/nba_naive/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_naive_holdout_first_k:
    model_dir: model_output/nba_naive/holdout_first_k/map
    validation_scheme: holdout_first_k

  nba_naive_random_interior:
    model_dir: model_output/nba_naive/random_interior/map
    validation_scheme: random_interior

  nba_naive_holdout_peak:
    model_dir: model_output/nba_naive/holdout_peak/map
    validation_scheme: holdout_peak

  nba_naive_stratified_next_k:
    model_dir: model_output/nba_naive/stratified_next_k/map
    validation_scheme: stratified_next_k
