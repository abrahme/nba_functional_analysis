    validation_scheme: holdout_first_k

  nba_convex_max_tvrflvm_AR_re_on_random_interior:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_on/random_interior/map
    validation_scheme: random_interior

  nba_convex_max_tvrflvm_AR_re_on_holdout_peak:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_on/holdout_peak/map
    validation_scheme: holdout_peak

  # Linear-factor pilot (nugget replacement test): both iid REs OFF, both linear-factor heads ON
  # (c/t offset = sigma * X @ lambda / 0.33 — a linear-kernel component on the peak GPs, equal
  # prior budget to the nuggets). Tests whether the star corrections are encodable in the shared
  # latent when X is free to reorganize; compare coverage_by_quality + ELPPD against _re_on.
  nba_convex_max_tvrflvm_AR_linear:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_c_linear: 1
      use_t_linear: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_linear/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_linear/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_linear/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_linear/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_linear_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_linear/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_convex_max_tvrflvm_AR_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_convex_max_tvrflvm_AR_holdout_first_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR/holdout_first_k/map
    validation_scheme: holdout_first_k

  nba_convex_max_tvrflvm_AR_random_interior:
    model_dir: model_output/nba_convex_max_tvrflvm_AR/random_interior/map
    validation_scheme: random_interior

  nba_convex_max_tvrflvm_AR_holdout_peak:
    model_dir: model_output/nba_convex_max_tvrflvm_AR/holdout_peak/map
    validation_scheme: holdout_peak

  nba_convex_max_tvrflvm_AR_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxSplitRFFTVLinearLVM (per-modality RFF kernels) ──────────────────
  # Same machinery as nba_convex_max_tvrflvm, but the peak-age / peak-value / curvature GPs each get
  # their OWN independent RFF kernel: own frequency draw AND own ARD lengthscale (sites: W_t_max /
  # lengthscale_t_max, W_c_max / lengthscale_c_max alongside the curvature W / lengthscale).
  # Independent draws are required for consistency — W is sampled (integrated), so one shared draw
  # would correlate the three kernel realizations instead of giving three independent GPs. "split"
  # in the name selects the class in dispatch_model. Restores a per-modality latent geometry, so
  # model_export emits the per-modality rescaled latents and latent_space.r's modality archetype
  # clusterings run for this model.
  nba_convex_max_tvrflvm_split:
    m_time: 5
    basis_dims: 10   # latent rank r
    approx_x_dim: 50       # RFF frequency count m; projected feature width = 2*m = 100
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_split/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_split/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_split/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_split/map/samples.pkl
        # All THREE RFF bandwidths fixed at MAP (same rationale as the shared-kernel entry: pins the
        # kernel scales and removes the W*sqrt(lengthscale) ridges); the three frequency draws
        # (W, W_t_max, W_c_max) stay sampled.
        fixed_params: [alpha, lengthscale_deriv, lengthscale, lengthscale_t_max, lengthscale_c_max,
                       sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_split_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_split/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxARSplitRFFTVLinearLVM (split-bandwidth RFF + AR(1)/calendar-year trend) ─
  nba_convex_max_tvrflvm_split_AR:
    m_time: 5
    basis_dims: 10   # latent rank r
    approx_x_dim: 50
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_split_AR/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_split_AR/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_split/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_split/map/samples.pkl
        # Three bandwidths fixed at MAP — see the non-AR split entry.
        fixed_params: [alpha, lengthscale_deriv, lengthscale, lengthscale_t_max, lengthscale_c_max,
                       sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_split_AR_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_split_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── alpha fixed-vs-learnable A/B comparison (REs off, tuned scale knobs) ──────
  # Question: with the curve/max/max-age REs off and the beta-offset fix in place, is it better to
  # FIX the per-metric curvature rate alpha at the prior-elicited values (0.15 for obpm/dbpm) or to
  # LEARN it? Both entries inherit the convex family (m_time=10, basis_dims=10, regimes) via the
  # _stratified_next_k suffix; they differ ONLY in prior_knobs.alpha and model_dir, so a MAP run of
  # each is a clean A/B. map_num_steps lowered to 50000 (REs off => simpler landscape than the base).
  nba_convex_max_tvlinearlvm_alpha_fixed_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm/stratified_next_k/map_alpha_fixed
    validation_scheme: stratified_next_k
    map_num_steps: 50000
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      alpha: {per_metric: {obpm: 0.15, dbpm: 0.15}, default: 1.0}   # fixed per-metric curvature rate

  nba_convex_max_tvlinearlvm_alpha_learn_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm/stratified_next_k/map_alpha_learn
    validation_scheme: stratified_next_k
    map_num_steps: 50000
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      alpha: {dist: HalfNormal, args: [1.0]}                        # learned per-metric (sampled k x 1)

  # ── ConvexMaxTVCosineLVM (cosine / normalized dot-product latent kernel) ──────
  # Same convex-max forward as nba_convex_max_tvlinearlvm, but _project_X returns X/||X||, so the
  # latent kernel phi(x)^T phi(x') is COSINE (bounded self-covariance = 1) instead of LINEAR (||X||^2).
  # Removes the ||X||^2 curvature/peak-age blow-up for extreme-covariate players: curve shape depends
  # on the DIRECTION of the embedding, not its magnitude. Mirrors the base convex prior_knobs; alpha /
  # sigma_* may want retuning since ||phi||=1 makes the effective amplitude ~1/sqrt(r) smaller.
  nba_convex_max_cosine_tvlinearlvm:
    m_time: 5
    basis_dims: 10
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_cosine_tvlinearlvm/map
      mcmc:
        mcmc_init: map   # seed NUTS from MAP samples (per request)
        model_dir:        model_output/nba_convex_max_cosine_tvlinearlvm/mcmc
        init_path:        model_output/nba_convex_max_cosine_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_cosine_tvlinearlvm/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_cosine_tvlinearlvm_stratified_next_k:
    model_dir: model_output/nba_convex_max_cosine_tvlinearlvm/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxARTVCosineLVM (cosine latent kernel + per-player AR) ─────────────
  nba_convex_max_cosine_tvlinearlvm_AR:
    m_time: 5
    basis_dims: 10
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_cosine_tvlinearlvm_AR/map
      mcmc:
        mcmc_init: map   # seed NUTS from MAP samples (per request)
        model_dir:        model_output/nba_convex_max_cosine_tvlinearlvm_AR/mcmc
        init_path:        model_output/nba_convex_max_cosine_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_cosine_tvlinearlvm/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_cosine_tvlinearlvm_AR_stratified_next_k:
    model_dir: model_output/nba_convex_max_cosine_tvlinearlvm_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxLKJTVLinearLVM (LKJ correlation across the metric axis of the curve weights) ──
  # Same convex forward as nba_convex_max_tvlinearlvm, but the HSGP curve weights are
  #   beta[r,m,:] = L_corr @ z,  L_corr ~ LKJCholesky(k, eta),  z ~ N(0,1)
  # so metrics share curvature structure (obpm/dbpm borrow strength) while each beta[r,m,k] stays
  # marginally N(0,1) (the alpha/spectral calibration is unchanged). eta is set via the attribute
  # knob prior_knobs.lkj_concentration (eta>1 shrinks toward independence). Defaults adopt the
  # alpha A/B outcome: REs off, learnable alpha, tuned scale knobs.
  nba_convex_max_lkj_tvlinearlvm:
    m_time: 5
    basis_dims: 10
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      # Per-metric HalfNormal prior on the curvature rate alpha (same family, metric-specific scale)
      # instead of a single HalfNormal(1). Scales seeded from the learned alpha of the REs-off
      # learnable-alpha A/B (weakly-informative, metric-calibrated). Tune via prior_check/holdout.
      alpha: *alpha_per_metric   # per-metric HalfNormal alpha (anchored on nba_convex_max_tvlinearlvm)
      lkj_concentration: 2.0
    regimes:
      map:
        model_dir: model_output/nba_convex_max_lkj_tvlinearlvm/map
      mcmc:
        mcmc_init: median
        model_dir:        model_output/nba_convex_max_lkj_tvlinearlvm/mcmc
        init_path:        model_output/nba_convex_max_lkj_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_lkj_tvlinearlvm/map/samples.pkl
        fixed_params: [sigma_t, alpha, lengthscale, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X, beta_corr_chol]
        thinning: ~

  nba_convex_max_lkj_tvlinearlvm_stratified_next_k:
    model_dir: model_output/nba_convex_max_lkj_tvlinearlvm/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── LKJ convex: alpha fixed-vs-learnable A/B (same as the non-LKJ A/B, now with LKJ metric
  # coupling on the curve weights). Inherits nba_convex_max_lkj_tvlinearlvm; differs only in
  # prior_knobs.alpha and model_dir, so a MAP run of each is a clean A/B.
  nba_convex_max_lkj_tvlinearlvm_alpha_fixed_stratified_next_k:
    model_dir: model_output/nba_convex_max_lkj_tvlinearlvm/stratified_next_k/map_alpha_fixed
    validation_scheme: stratified_next_k
    map_num_steps: 50000
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      alpha: {per_metric: {obpm: 0.15, dbpm: 0.15}, default: 1.0}
      lkj_concentration: 2.0

  nba_convex_max_lkj_tvlinearlvm_alpha_learn_stratified_next_k:
    model_dir: model_output/nba_convex_max_lkj_tvlinearlvm/stratified_next_k/map_alpha_learn
    validation_scheme: stratified_next_k
    map_num_steps: 50000
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      alpha: {dist: HalfNormal, args: [1.0]}
      lkj_concentration: 2.0

  # ── LKJ convex + per-player level/peak-age REs (c_offset_re + t_offset_re; NO curve_re) ──────
  # The REs-off A/B answered the alpha/LKJ questions; this re-enables the per-player level (c_offset_re)
  # and peak-age (t_offset_re) random effects so curves can track individuals (the REs-off MAP curves
  # over-regularized to the population). curve_re stays OFF (it was the -10000 tail inflator). LKJ +
  # learnable alpha retained. More Adam steps since the hierarchical REs make a harder landscape.
  nba_convex_max_lkj_tvlinearlvm_re_on_stratified_next_k:
    model_dir: model_output/nba_convex_max_lkj_tvlinearlvm/stratified_next_k/map_re_on
    validation_scheme: stratified_next_k
    map_num_steps: 150000
    prior_knobs:
      use_c_offset_re: 1
      use_t_offset_re: 1
      use_curve_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      alpha: {dist: HalfNormal, args: [1.0]}
      lkj_concentration: 2.0

  # ── ConvexMaxARLKJTVLinearLVM (convex + per-player AR + LKJ metric correlation) ──
  nba_convex_max_lkj_tvlinearlvm_AR:
    m_time: 5
    basis_dims: 10
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 0
      use_t_offset_re: 0
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      sigma_t: 0.5
      # Per-metric HalfNormal prior on alpha (same family, metric-specific scale); see base entry.
      alpha: *alpha_per_metric   # per-metric HalfNormal alpha (anchored on nba_convex_max_tvlinearlvm)
      lkj_concentration: 2.0
    regimes:
      map:
        model_dir: model_output/nba_convex_max_lkj_tvlinearlvm_AR/map
      mcmc:
        mcmc_init: median
        model_dir:        model_output/nba_convex_max_lkj_tvlinearlvm_AR/mcmc
        init_path:        model_output/nba_convex_max_lkj_tvlinearlvm_AR/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_lkj_tvlinearlvm_AR/map/samples.pkl
        fixed_params: [sigma_t, alpha, lengthscale, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X, beta_corr_chol]
        thinning: ~

  nba_convex_max_lkj_tvlinearlvm_AR_stratified_next_k:
    model_dir: model_output/nba_convex_max_lkj_tvlinearlvm_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── LKJTVLinearLVM (non-convex GPLVM + LKJ metric correlation) ────────────────
  # eta via prior_knobs.lkj_concentration; correlates the metric axis of the MVN curve weights while
  # each metric's marginal stays MVN(0, kernel). No REs (non-convex family has none).
  nba_lkj_tvlinearlvm:
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      alpha: {dist: HalfNormal, args: [1.0]}   # learnable per-metric amplitude (sampled => alpha__loc for MAP reconstruction)
      lkj_concentration: 2.0
    regimes:
      map:
        model_dir: model_output/nba_lkj_tvlinearlvm/map
      mcmc:
        model_dir:        model_output/nba_lkj_tvlinearlvm/mcmc
        init_path:        model_output/nba_lkj_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_lkj_tvlinearlvm/map/samples.pkl
        fixed_params: [lengthscale, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X, beta_corr_chol]
        thinning: ~

  nba_lkj_tvlinearlvm_stratified_next_k:
    model_dir: model_output/nba_lkj_tvlinearlvm/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── LKJTVLinearLVM_AR (non-convex GPLVM + per-player AR + LKJ metric correlation) ──
  nba_lkj_tvlinearlvm_AR:
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      sigma: {dist: InverseGamma, args: [5, 600]}
      sigma_X: 0.3
      sigma_W_proj: 0.5
      alpha: {dist: HalfNormal, args: [1.0]}   # learnable per-metric amplitude (sampled => alpha__loc for MAP reconstruction)
      lkj_concentration: 2.0
    regimes:
      map:
        model_dir: model_output/nba_lkj_tvlinearlvm_AR/map
      mcmc:
        model_dir:        model_output/nba_lkj_tvlinearlvm_AR/mcmc
        init_path:        model_output/nba_lkj_tvlinearlvm_AR/map/samples.pkl
        fixed_param_path: model_output/nba_lkj_tvlinearlvm_AR/map/samples.pkl
        fixed_params: [lengthscale, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X, beta_corr_chol]
        thinning: ~

  nba_lkj_tvlinearlvm_AR_stratified_next_k:
    model_dir: model_output/nba_lkj_tvlinearlvm_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── TVLinearLVM (direct GP kernel, identity projection, mean-centered intercept) ──
  nba_tvlinearlvm:
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_tvlinearlvm/map
      mcmc:
        model_dir:        model_output/nba_tvlinearlvm/mcmc
        init_path:        model_output/nba_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_tvlinearlvm/map/samples.pkl
        fixed_params: [lengthscale, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_tvlinearlvm_holdout_last_k:
    model_dir: model_output/nba_tvlinearlvm/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_tvlinearlvm_holdout_first_k:
