        # site. Fixed plug-ins still load from fixed_param_path, so the cut is unchanged.
        # The slope_* entries share the map+prefit pattern but do sample, so this is specific to
        # the use_injury_continuous/use_injury_decay path.
        mcmc_init: median
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_injury_causal_ct_sym/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal_sym_v2/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal_sym_v2/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  nba_convex_max_tvrflvm_AR_injury_causal_ct_placebo_sym:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    num_warmup: 2000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    injury_data_csv: data/injury_player_cleaned_placebo_v2.csv
    injury_type_grouping: mechanism4
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      use_injury_continuous: 1
      use_injury_decay: 1
      injury_recovery_tau: 0.75
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
