  # ── ConvexMaxARTVLinearLVM ─────────────────────────────────────────────────
  nba_convex_max_tvlinearlvm_AR:
    m_time: 5   # HSGP age-basis count (= default)
    basis_dims: 10   # latent rank r
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric   # per-metric fixed alpha (see nba_convex_max_tvlinearlvm)
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_AR/map
      mcmc:
        mcmc_init: map   # seed NUTS from MAP samples (per request)
        model_dir:        model_output/nba_convex_max_tvlinearlvm_AR/mcmc
        init_path:        model_output/nba_convex_max_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvlinearlvm_AR_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm_AR/holdout_last_k/map
    validation_scheme: holdout_last_k

