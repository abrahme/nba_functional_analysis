      - {name: putback_pts,   distribution: negative-binomial, exposure: off_poss}
      - {name: self_oreb,     distribution: poisson,           exposure: off_poss}
      - {name: blocks_at_rim, distribution: poisson,           exposure: def_poss}
      - {name: blocks_pbp,    distribution: poisson,           exposure: def_poss}
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      use_injury_continuous: 1
      use_injury_decay: 1
      injury_recovery_tau: 0.75
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_athl_injury_causal_ct_placebo_sym/map
      mcmc:
        mcmc_init: median
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_athl_injury_causal_ct_placebo_sym/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_athl_causal_sym/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_athl_causal_sym/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  nba_convex_max_tvrflvm_AR_causal_prefit:
    m_time: 5
    basis_dims: 10         # latent rank r
    approx_x_dim: 50       # RFF frequency count m; projected feature width = 2*m = 100
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~          # null → no lower bound: all available years
    end_year: ~            # null → no upper bound: all available years
    injury: true
    censor_survival_at_injury: true
    validation_scheme: ~   # no holdout scheme
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map

  # SYMMETRIC-CUT prefit: identical to nba_convex_max_tvrflvm_AR_causal_prefit but fit on the
  # UNION panel (real injuries + the placebo's pseudo-onsets, data_causal/make_placebo_injury_csv.py)
  # so BOTH cohorts are censored/masked at onset. Stage 1 is then equally blind to real and
  # placebo post-onset fates: the placebo pass criterion (effect ~= 0) is fair, and
  # real-minus-placebo is a valid calibrated hazard contrast. Motivated by the asymmetric
  # placebo finding (placebo exit offset +2.7 vs real -0.6 — opposite signs, same instrument
  # needed). Name carries no "injury" token -> non-injury RFF dispatch, as with the base prefit.
  nba_convex_max_tvrflvm_AR_causal_sym_prefit:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    censor_survival_at_injury: true
    injury_data_csv: data/injury_player_cleaned_symmetric.csv
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_causal_sym/prefit/map

  # Stage 2 — freeze Stage 1's counterfactual params, sample ONLY the injury-specific sites. The
  # "injury" token + injury: true make dispatch_model select ConvexMaxInjuryRFFTVLinearLVM, which
  # already carries the AR(1)/calendar trend (it derives from ConvexMaxInjuryTVLinearLVM ->
  # ConvexMaxARTVLinearLVM) alongside the RFF feature map — i.e. this IS the concave RFF + AR +
  # injury variant; there is no separate AR-injury-RFF class to select.
  nba_convex_max_tvrflvm_AR_injury_causal:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_injury_causal/map
      mcmc:
        mcmc_init: map     # seed NUTS from the Stage 1 prefit MAP
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_injury_causal/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal/prefit/map/samples.pkl
        # Freeze = intersection of these names with the prefit samples.pkl keys (main.py only fixes
        # params it finds in the loaded MAP blob), so names must match the SAVED site names.
        # Beyond the linear AR causal stage-2 list this adds:
        #   W, lengthscale               — the RFF feature map (frequencies (m,r) + ARD bandwidth (r,)),
        #                                  sampled in ConvexMaxRFFTVLinearLVM._resolve_latent_X_structured.
        #                                  Omit them and the counterfactual latent map is re-sampled.
        # Left free on purpose: the survival-hazard globals (eta_global_log / gamma_global_log) and
        # sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial — re-fit under the injury
        # likelihood (matches the linear causal pair).
        # Observation-noise dispersion is now FROZEN at the Stage-1 (healthy) value: it is part of
        # the counterfactual observation model, and re-fitting it under the injury likelihood both
        # leaks injury-period residuals into the counterfactual and creates a mean/dispersion ridge
        # (one obs per player-season) that wrecked mixing. Frozen => cleaner cut + better geometry.
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # Stage 2, decline-acceleration variant: the injury effect gains a per-year slope in
  # time-since-onset — injury_effect[k,n,t] = 1{t>=t0}(tau_level[k,i] + tau_slope[k,i]*(t-t0)) —
  # the metric-side counterpart of the hazard's aging-rate acceleration. Same cut (same prefit,
  # same fixed_params); only the injury sites (now incl. injury_slope_*) are sampled. The
  # deterministic injury_effect_h2 (= level + 2*slope) is the reported horizon estimand.
  nba_convex_max_tvrflvm_AR_injury_causal_slope:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 50000
    age_min: 18
    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
