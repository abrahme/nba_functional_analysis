    model_dir: model_output/nba_convex_max_tvlinearlvm_AR/random_interior/map
    validation_scheme: random_interior

  nba_convex_max_tvlinearlvm_AR_holdout_peak:
    model_dir: model_output/nba_convex_max_tvlinearlvm_AR/holdout_peak/map
    validation_scheme: holdout_peak

  nba_convex_max_tvlinearlvm_AR_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm_AR/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxInjuryTVLinearLVM ─────────────────────────────────────────────
  nba_convex_max_tvlinearlvm_injury:
    injury: true
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_injury/map
      mcmc:
        model_dir:        model_output/nba_convex_max_tvlinearlvm_injury/mcmc
        init_path:        model_output/nba_convex_max_tvlinearlvm_injury/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm_injury/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: 50
      # Cut-posterior MCMC (run_cut_gibbs_inference): two-block Gibbs — the counterfactual latents
      # (X, curves, AR, hazard) are NUTS-updated against the injury-free likelihood (post-first-injury
      # observations masked, survival censored at onset), the injury sites against the full likelihood
      # conditional on the counterfactual draw. Kills the factor-absorption / bad-control bias
      # (arXiv:2604.27187). init_path unused (init_to_median); fixed plug-in hyperparams still load.
      # NOTE: the plug-ins come from the JOINT-fit MAP, which is itself absorption-contaminated —
      # consider pointing fixed_param_path at the healthy-only causal prefit for full hygiene.
      cut_mcmc:
        model_dir:        model_output/nba_convex_max_tvlinearlvm_injury/cut_mcmc
        init_path:        ~
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm_injury/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: 50

  nba_convex_max_tvlinearlvm_injury_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm_injury/holdout_last_k/map
    validation_scheme: holdout_last_k
    injury: true

  nba_convex_max_tvlinearlvm_injury_holdout_first_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm_injury/holdout_first_k/map
    validation_scheme: holdout_first_k
    injury: true

  nba_convex_max_tvlinearlvm_injury_random_interior:
    model_dir: model_output/nba_convex_max_tvlinearlvm_injury/random_interior/map
    validation_scheme: random_interior
    injury: true

  nba_convex_max_tvlinearlvm_injury_holdout_peak:
    model_dir: model_output/nba_convex_max_tvlinearlvm_injury/holdout_peak/map
    validation_scheme: holdout_peak
    injury: true

  nba_convex_max_tvlinearlvm_injury_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm_injury/stratified_next_k/map
    validation_scheme: stratified_next_k
    injury: true

  # ── ConvexMaxInjuryRFFTVLinearLVM (RFF latent kernel + injury effects) ────────
  # Injury leaf of the RFF family: same injury forward + cut machinery as
  # nba_convex_max_tvlinearlvm_injury, with the RFF feature map (2m features, unit
  # self-covariance) from nba_convex_max_tvrflvm. Reuses the convex-family prior anchors.
  nba_convex_max_tvrflvm_injury:
    injury: true
    m_time: 5
    basis_dims: 10   # latent rank r
    approx_x_dim: 50       # RFF frequency count m; projected feature width = 2*m = 100
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_injury/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_injury/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_injury/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_injury/map/samples.pkl
        # lengthscale FIXED at MAP (RFF ARD bandwidth) like the other RFF entries — pins the kernel
        # scale and removes the W*sqrt(lengthscale) ridge; W stays sampled.
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: 50
      # Cut-posterior MCMC — see the nba_convex_max_tvlinearlvm_injury cut_mcmc notes.
      cut_mcmc:
        model_dir:        model_output/nba_convex_max_tvrflvm_injury/cut_mcmc
        init_path:        ~
        fixed_param_path: model_output/nba_convex_max_tvrflvm_injury/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: 50

  nba_convex_max_tvrflvm_injury_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvrflvm_injury/holdout_last_k/map
    validation_scheme: holdout_last_k
    injury: true

  nba_convex_max_tvrflvm_injury_holdout_first_k:
    model_dir: model_output/nba_convex_max_tvrflvm_injury/holdout_first_k/map
    validation_scheme: holdout_first_k
    injury: true

  nba_convex_max_tvrflvm_injury_random_interior:
    model_dir: model_output/nba_convex_max_tvrflvm_injury/random_interior/map
    validation_scheme: random_interior
    injury: true

  nba_convex_max_tvrflvm_injury_holdout_peak:
    model_dir: model_output/nba_convex_max_tvrflvm_injury/holdout_peak/map
    validation_scheme: holdout_peak
    injury: true

  nba_convex_max_tvrflvm_injury_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_injury/stratified_next_k/map
    validation_scheme: stratified_next_k
    injury: true

  # ── Two-Stage Causal Injury Pipeline ─────────────────────────────────────────
  # Stage 1: fit aging curve on healthy observations only; survival censored at
  # injury onset. Produces clean counterfactual plug-ins (X, beta, AR, survival).
  # Stage 2: fix Stage 1 params; sample only injury-specific parameters.

  nba_convex_max_tvlinearlvm_causal_prefit:
    age_max: 45
    m_time: 5
    end_year: 2023
    injury: true
    censor_survival_at_injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_causal/prefit/map

  nba_convex_max_tvlinearlvm_AR_causal_prefit:
    age_max: 45
    m_time: 5
    end_year: 2023
    injury: true
    censor_survival_at_injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_AR_causal/prefit/map

  nba_convex_max_tvlinearlvm_injury_causal:
    age_max: 45
    m_time: 5
    end_year: 2023
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_injury_causal/map
      mcmc:
        model_dir:        model_output/nba_convex_max_tvlinearlvm_injury_causal/mcmc
        init_path:        model_output/nba_convex_max_tvlinearlvm_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm_causal/prefit/map/samples.pkl
        # The survival-hazard globals (eta_global_log / gamma_global_log) are deliberately NOT
        # frozen — they are re-fit under the injury likelihood, like the dispersion params.
        # Dispersion frozen at Stage-1 healthy value (part of the counterfactual noise model).
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X,
                       exit, sigma_exit_scale, exit_rate,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  nba_convex_max_tvlinearlvm_AR_injury_causal:
    age_max: 45
    m_time: 5
    end_year: 2023
    injury: true
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm_AR_injury_causal/map
      mcmc:
        model_dir:        model_output/nba_convex_max_tvlinearlvm_AR_injury_causal/mcmc
        init_path:        model_output/nba_convex_max_tvlinearlvm_AR_causal/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm_AR_causal/prefit/map/samples.pkl
        # Survival-hazard globals deliberately left free — see the non-AR causal entry above.
        # Dispersion frozen at Stage-1 healthy value (part of the counterfactual noise model) — see
        # the RFF causal entry below.
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # ── Two-Stage Causal Injury Pipeline: RFF leaf (concave RFF + AR + injury) ───
  # Mirrors the nba_convex_max_tvlinearlvm_AR_causal_prefit / _AR_injury_causal pair on the RFF
  # latent kernel, with no holdout scheme, ages 18-45, and all available data years.
  #
  # IMPORTANT: "_causal_prefit" / "_injury_causal" are NOT in config_utils._SCHEME_SUFFIXES (only the
  # 5 holdout schemes are), so resolve_model_config does NO base-entry inheritance for these keys —
  # merged = defaults + this entry + its regime. Every RFF knob must therefore be repeated here;
  # approx_x_dim above all, since the default of 0 would silently disable the RFF feature map.

  # Stage 1 — healthy-only counterfactual prefit (MAP). injury: true masks post-first-injury
  # observations and censor_survival_at_injury censors the exit hazard at onset, so the curve /
  # latents are the injury-free fit. The name deliberately carries NO "injury" token, so
  # dispatch_model takes the non-injury RFF branch -> ConvexMaxARRFFTVLinearLVM (aging + AR only).
  # ===== ATHLETICISM INJURY SUITE =====
  # Mirrors the box-score ct_sym / ct_placebo_sym pair, on the athleticism panel. Same two-stage
  # cut: the prefit fixes the injury-free counterfactual curves, then stage 2 samples ONLY the
  # injury sites against the full likelihood.
  # mcmc_init is median throughout -- see the box-score ct_sym entry for why map init freezes
  # the continuous-time path.

  # Stage 1: injury-free counterfactual on the SYMMETRIC panel.
  nba_convex_max_tvrflvm_AR_athl_causal_sym_prefit:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    age_min: 18
    age_max: 45
    # start_year pinned to 1997 (NOT ~ as in the box-score suite): play-by-play does not exist
    # before that, so earlier rows carry no athleticism data. The prefit and the injury run MUST
    # share this window -- the cut freezes X by position, so a differing player set breaks it.
    start_year: 1997
    end_year: 2025
    map_num_steps: 50000
    injury: false
    injury_data_csv: data/athleticism_panel_symmetric.csv
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    metrics:
      - {name: at_rim_fga,    distribution: negative-binomial, exposure: off_poss}
      - {name: at_rim_fgm,    distribution: binomial,          exposure: at_rim_fga}
      - {name: at_rim_unast,  distribution: binomial,          exposure: at_rim_fgm}
      - {name: fg2a_blocked,  distribution: binomial,          exposure: fg2a_pbp}
      - {name: sfd_2pt,       distribution: negative-binomial, exposure: off_poss}
      - {name: and1_2pt,      distribution: poisson,           exposure: off_poss}
      - {name: putback_pts,   distribution: negative-binomial, exposure: off_poss}
      - {name: self_oreb,     distribution: poisson,           exposure: off_poss}
      - {name: blocks_at_rim, distribution: poisson,           exposure: def_poss}
      - {name: blocks_pbp,    distribution: poisson,           exposure: def_poss}
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_athl_causal_sym/prefit/map

  # Stage 2: the estimand.
  nba_convex_max_tvrflvm_AR_athl_injury_causal_ct_sym:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    age_min: 18
    age_max: 45
    # start_year pinned to 1997 (NOT ~ as in the box-score suite): play-by-play does not exist
    # before that, so earlier rows carry no athleticism data. The prefit and the injury run MUST
    # share this window -- the cut freezes X by position, so a differing player set breaks it.
    start_year: 1997
    end_year: 2025
