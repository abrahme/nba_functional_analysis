        fixed_param_path: model_output/nba_convex_max_tvlinearlvm_q20/holdout_last_k/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
