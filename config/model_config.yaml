# Full run configuration for main.py.
# Usage: python main.py --model_name=<name> --model_config=config/model_config.yaml \
#                       --inference_method=map
#
# Merge order (later wins):
#   defaults → base_entry → regimes[inference_method] → scheme_entry
#
# "base_entry" is found by stripping the scheme suffix from model_name, so
# regimes / fixed_params defined once on the base automatically apply to all
# scheme variants.  Scheme entries should only carry fields that differ per
# scheme: model_dir, validation_scheme, injury.
#
# All artifacts for a run (pkl, CSVs, plots) live under model_dir.
# Coverage tables are written to model_output/model_plots/coverage/ (unchanged).

defaults:
  inference_method: map
  mcmc_init: map         # MCMC init strategy: 'map' (seed NUTS from MAP samples) | 'median' (init_to_median; no MAP seeding, fixed plug-in params still loaded from fixed_param_path)
  basis_dims: 10
  metrics:
    - {name: games,       distribution: beta-binomial,    exposure: games_exposure}
    - {name: usg,         distribution: beta,             exposure: minutes}
    - {name: pct_minutes, distribution: beta,             exposure: games}
    - {name: obpm,        distribution: gaussian,         exposure: minutes}
    - {name: dbpm,        distribution: gaussian,         exposure: minutes}
    - {name: blk,         distribution: poisson,          exposure: minutes}
    - {name: stl,         distribution: poisson,          exposure: minutes}
    - {name: ast,         distribution: poisson,          exposure: minutes}
    - {name: dreb,        distribution: poisson,          exposure: minutes}
    - {name: oreb,        distribution: poisson,          exposure: minutes}
    - {name: tov,         distribution: poisson,          exposure: minutes}
    - {name: fta,         distribution: negative-binomial, exposure: minutes}
    - {name: fg2a,        distribution: negative-binomial, exposure: minutes}
    - {name: fg3a,        distribution: negative-binomial, exposure: minutes}
    - {name: ftm,         distribution: binomial,         exposure: fta}
    - {name: fg2m,        distribution: binomial,         exposure: fg2a}
    - {name: fg3m,        distribution: binomial,         exposure: fg3a}
  approx_x_dim: 0
  basis_dims_2: ~
  num_chains: 2
  num_samples: 2000
  num_warmup: 1000
  map_num_steps: 50000   # MAP/SVI Adam steps (raise for harder stacked-RE landscapes)
  # Prior knobs overridden after initialize_priors (model/inference_inputs.py:apply_prior_knobs).
  # Empty by default => current hardcoded priors preserved exactly. Override per-model here, or
  # via prior_check.py --set KEY=VAL / --sweep KEY=v1,v2,.. for prior-predictive tuning.
  # Tunable keys (current values shown for reference):
  #   sigma_curve: 0.5        sigma_c_offset: 1.0     sigma_t_offset: 1.0
  #   sigma_X: 1.0            sigma_W_proj: 1.0       x_latent_df: 4.0
  #   lengthscale_deriv: {dist: LogNormal, args: [1.0986, 0.7]}   # log(3), 0.7
  prior_knobs: {}
  position_group: all
  validation_year: 2025
  cohort_year: 2025
  age_max: 38
  age_min: 18
  start_year: 1997         # null → no lower bound on data year
  end_year: 2025           # null → no upper bound on data year
  m_time: 5             # number of HSGP basis functions for the age axis
  validation_scheme: ~
  holdout_fraction: 0.2
  holdout_k: 2
  holdout_seed: 42
  de_trend_metrics: []
  player_names: []
  fixed_param_path: ~
  fixed_params: []
  init_path: ~
  model_dir: ~           # null → model_output/<model_name>/<inference_method>
  vectorized: false
  injury: false
  censor_survival_at_injury: false
  debug_nan: false
  thinning: 250               # null → num_samples / 250

models:
  # ── ConvexMaxTVLinearLVM ───────────────────────────────────────────────────
  nba_convex_max_tvlinearlvm:
    m_time: 5   # HSGP age-basis count (= default)
    basis_dims: 10   # latent rank r
    map_num_steps: 50000   # REs are off, so the simpler landscape converges in 50k (matches the other variants)
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      # Random effects OFF (per-player level/peak-age/curvature). They overfit at MAP and add ~100k
      # hierarchical params that made MCMC hit max tree depth; off => smaller, tractable geometry.
      use_curve_re: &re_off 0
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      # Tuned prior scales shared across the convex family (anchored, reused by the AR/LKJ variants).
      sigma: &convex_sigma {dist: InverseGamma, args: [5, 600]}
      # LEARNED (no longer fixed): the fixed 0.3/0.5 shrank E||X||^2/r to ~0.6 (vs the /sqrt(r)
      # normalization's assumption of 1.0), under-amplifying the curve -> flat MAP. Learn them at MAP so
      # the latent scale can grow to the right amplitude; still in fixed_params so they're pinned at MCMC.
      sigma_X: &convex_sigma_X {dist: HalfNormal, args: [0.5]}
      sigma_W_proj: &convex_sigma_W {dist: HalfNormal, args: [1.0]}
      # Peak-AGE spread: LEARNED, not fixed. Resolved at sample_shape (1,k) so each metric gets its own
      # sigma_t ~ HalfNormal(0.5) iid. Fixing it (esp. pct_minutes=0.1) pinned the peak age ~28 and made
      # young early-career players structurally uncoverable; a prior lets the data set per-metric spread.
      # Non-centered (t_max = tanh(psi*(t_max_raw*sigma_t)+...)), so sampling it stays well-conditioned.
      sigma_t: &convex_sigma_t {dist: HalfNormal, args: [0.5]}
      # Peak-VALUE spread: also LEARNED (was fixed from MAP). InverseGamma(2,1) keeps a heavy right tail so
      # elite players can attain high peaks; resolved at (1,k) so each metric gets its own sigma_c iid.
      sigma_c: &convex_sigma_c {dist: InverseGamma, args: [2, 1]}
      # Curvature rate alpha: LEARNED per-metric ~ HalfNormal(1.0) (resolved at (k,1), iid), like the
      # LKJ variants. The alpha<->beta ridge that wrecked sampling is an MCMC problem, so alpha is
      # learned at MAP and then held fixed during MCMC (it's listed in the mcmc fixed_params), which
      # removes the ridge while letting the data set per-metric curvature (no more hand-set 0.1 hack).
      alpha: &alpha_per_metric {dist: HalfNormal, args: [1.0]}
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvlinearlvm/map
      mcmc:
        mcmc_init: map   # seed NUTS from the MAP samples (per request); fixed_params hyperparams are plugged in from MAP, sampled latents start at their MAP point
        model_dir:        model_output/nba_convex_max_tvlinearlvm/mcmc
        init_path:        model_output/nba_convex_max_tvlinearlvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvlinearlvm/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvlinearlvm_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_convex_max_tvlinearlvm_holdout_first_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm/holdout_first_k/map
    validation_scheme: holdout_first_k

  nba_convex_max_tvlinearlvm_random_interior:
    model_dir: model_output/nba_convex_max_tvlinearlvm/random_interior/map
    validation_scheme: random_interior

  nba_convex_max_tvlinearlvm_holdout_peak:
    model_dir: model_output/nba_convex_max_tvlinearlvm/holdout_peak/map
    validation_scheme: holdout_peak

  nba_convex_max_tvlinearlvm_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvlinearlvm/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxRFFTVLinearLVM (RFF latent kernel) ────────────────────────────
  # RFF leaf of the ConvexMaxTVLinearLVM family: identical machinery (structured prior, REs,
  # survival, compute_curves) with the latent feature map = RFF cos/sin of W*X (approx_x_dim = m
  # frequencies -> 2*m features) instead of the linear identity. Mirrors the tvlinearlvm blocks;
  # reuses the convex-family prior anchors (*re_off, *convex_sigma, ...).
  nba_convex_max_tvrflvm:
    m_time: 5
    basis_dims: 10   # latent rank r
    approx_x_dim: 50       # RFF frequency count m; projected feature width = 2*m = 100
    map_num_steps: 50000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm/map/samples.pkl
        # RFF feature map: lengthscale (ARD bandwidth) FIXED at MAP like lengthscale_deriv — pins the
        # kernel scale and removes the W*sqrt(lengthscale) scaling ridge; W stays sampled (the frequency
        # realization is integrated). sigma_exit_scale is a LEARNED per-player survival scale
        # (models.py:1884), plugged in at MCMC like the other scale hyperparameters.
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvrflvm/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_convex_max_tvrflvm_holdout_first_k:
    model_dir: model_output/nba_convex_max_tvrflvm/holdout_first_k/map
    validation_scheme: holdout_first_k

  nba_convex_max_tvrflvm_random_interior:
    model_dir: model_output/nba_convex_max_tvrflvm/random_interior/map
    validation_scheme: random_interior

  nba_convex_max_tvrflvm_holdout_peak:
    model_dir: model_output/nba_convex_max_tvrflvm/holdout_peak/map
    validation_scheme: holdout_peak

  nba_convex_max_tvrflvm_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ── ConvexMaxARRFFTVLinearLVM (RFF latent kernel + AR(1)/calendar-year trend) ─
  nba_convex_max_tvrflvm_AR:
    m_time: 5
    basis_dims: 10   # latent rank r
    approx_x_dim: 50
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm/map/samples.pkl
        # lengthscale FIXED (ARD bandwidth) — pins the RFF kernel scale, removes the W*sqrt(lengthscale)
        # ridge; W stays sampled. (See the non-AR block for the sigma_exit_scale note.)
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  # REs-on pilot (star-bias lever): identical to the flagship AR-RFF but with the per-player
  # peak-value and peak-age random effects ENABLED (curve_re stays off — documented tail
  # inflator). Targets the star mean-bias measured by coverage_by_quality.csv after the
  # export-noise fix: top-career-OBPM-tercile OBPM coverage 73.9% with HIGHER abs bias and
  # NARROWER intervals than the bottom tercile — a bias failure the demeaned AR(1) cannot absorb.
  # Peak-VALUE RE only: c_offset_re on, t_offset_re OFF. The peak-age RE contributes variance
  # without discrimination -- decomposing the OBPM peak-age posterior, the shared (RBF) component
  # gives within-player SD 1.01 against a between-player SD of 2.08 (ratio 0.48, players well
  # separated), but adding the age RE doubles the within-player SD to 2.06 while the between-player
  # spread barely moves (2.26), pushing the ratio to 0.92 -- i.e. a player's own uncertainty
  # swallows the differences between players and peak age becomes uninterpretable (Jokic, with 10
  # seasons and an observed peak, still gets a 95% CI 8.5 years wide). The peak-VALUE RE behaves
  # well by the same measure (ratio 0.44) and is what fixes the star-coverage bias this whole
  # exercise was aimed at, so it is retained.
  nba_convex_max_tvrflvm_AR_re_c_only:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 1
      use_t_offset_re: 0
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_re_c_only/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_re_c_only/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_re_c_only/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_re_c_only/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_re_c_only_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_c_only/stratified_next_k/map
    validation_scheme: stratified_next_k

  nba_convex_max_tvrflvm_AR_re_on:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 1
      use_t_offset_re: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_re_on/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_re_on/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_re_on/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_re_on/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_re_on_holdout_last_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_on/holdout_last_k/map
    validation_scheme: holdout_last_k

  nba_convex_max_tvrflvm_AR_re_on_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_on/stratified_next_k/map
    validation_scheme: stratified_next_k

  # ATHLETICISM panel (PBPStats shot-location / contact metrics, possessions as exposure).
  # Same model class and priors as the adopted RE spec above -- only the OBSERVABLES change.
  #
  # Why: the main panel's metrics measure how MUCH a player produces, which a skilled player can
  # hold flat after an injury by changing how he plays. These measure HOW he produces -- whether he
  # still gets to the rim, finishes there, creates his own shot, draws contact inside the arc, and
  # jumps for his own miss -- so the latent space encodes athleticism/explosiveness, not quality.
  #
  # Deliberately EXCLUDES obpm/dbpm/usg/pct_minutes. Including them lets "good at basketball" load
  # onto X, which is exactly the confounding this panel exists to avoid: a high-OBPM player would
  # otherwise read as immune to injury effects because the embedding already encodes his quality.
  # Measured support for the split: the panel's first factor holds 48.5% of variance raw and 49.6%
  # after residualising on obpm/dbpm/usage/TsPct/minutes -- i.e. it is essentially orthogonal to
  # quality. at_rim_unast (R^2 = 0.06 vs quality) and self_oreb (0.09) are the ANCHORS that
  # identify the athleticism factor; steals was dropped (r = -0.09 with the factor, it is lateral
  # quickness, a different construct) and all 3pt unassisted shares were dropped (age slope
  # ~ -0.003, flat -- a pull-up three is not a burst skill).
  #
  # Exposure is possessions, not minutes: minutes conflates with pace, which drifts across the
  # 1997-2026 window. Residual era drift after possession-normalising is small (|10-20%| over 28
  # years, <1%/yr), so de_trend_metrics stays [] as in the adopted spec -- but if peaks look
  # era-contaminated, enabling it for putback_pts / blocks_at_rim (-17%, -20%) is the first thing
  # to try.
  #
  # start_year is 1997 by default, which matters here: play-by-play does not exist before that and
  # the athleticism columns would be all-missing. Coverage on 1997+ is 87.7% (2,338 players).
  nba_convex_max_tvrflvm_AR_athl:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    injury_data_csv: data/athleticism_panel.csv
    metrics:
      # --- rim pressure: can he still get there, and finish? ---
      - {name: at_rim_fga,    distribution: negative-binomial, exposure: off_poss}
      - {name: at_rim_fgm,    distribution: binomial,          exposure: at_rim_fga}
      # ANCHOR -- self-creation at the rim, least quality-contaminated metric in the set
      - {name: at_rim_unast,  distribution: binomial,          exposure: at_rim_fgm}
      # getting stuffed = less lift (OFFENSIVE field; see build_athleticism_panel.py naming trap)
      - {name: fg2a_blocked,  distribution: binomial,          exposure: fg2a_pbp}
      # --- contact generation inside the arc ---
      - {name: sfd_2pt,       distribution: negative-binomial, exposure: off_poss}
      - {name: and1_2pt,      distribution: poisson,           exposure: off_poss}
      # --- second jump / verticality ---
      - {name: putback_pts,   distribution: negative-binomial, exposure: off_poss}
      - {name: self_oreb,     distribution: poisson,           exposure: off_poss}   # ANCHOR
      # --- defensive verticality ---
      - {name: blocks_at_rim, distribution: poisson,           exposure: def_poss}
      - {name: blocks_pbp,    distribution: poisson,           exposure: def_poss}
    prior_knobs:
      use_curve_re: 0
      use_c_offset_re: 1
      use_t_offset_re: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_athl/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_athl/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_athl/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_athl/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_athl_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_athl/stratified_next_k/map
    validation_scheme: stratified_next_k

  # REs + LINEAR peak-value kernel. The RFF/SE kernel is stationary, so the peak-value readout
  # reverts toward the neighbourhood mean and compresses elite players: regressing the shared
  # (RE-free) ceiling on observed best OBPM for well-measured players gives slope 0.31 (1.0 =
  # no compression), and the best sextile sits 4.14 BELOW what it has already produced. The
  # nugget lifts the slope only to 0.49 -- it is unstructured, so it cannot know that a
  # high-X player should extrapolate higher; it can only memorise players it has seen. Adding
  # k_lin to the peak-value process (k_SE + k_lin + nugget) lets the ceiling keep rising along
  # the quality direction of X, which is what a draft-cohort projection needs. Peak AGE keeps
  # the SE kernel: the compression problem is specific to the value.
  # REs + LOOSENED peak-value amplitude prior. Diagnosis: the OBPM peak-value process is pinned
  # against its amplitude cap -- sigma_c[obpm] = 2.09 (raw OBPM units; metrics are NOT normalised,
  # process_data is called without normalize) against a modeled shared peak-value SD of 2.06, i.e.
  # 98% of the cap. It is the ONLY metric in that state: the other 16 use 2-22% of their sigma_c.
  # A process that can only span +/-2.09 around the population mean cannot represent players whose
  # true peaks are 6-8, which is exactly the compression we measure (slope of shared ceiling on
  # observed best = 0.31; the top sextile sits 4.14 below what it has already produced).
  #
  # Two things kept it small: the prior InverseGamma(2, 1) puts the prior mean at 1, and sigma_c is
  # in fixed_params so MCMC inherits the MAP value and can never relax it. Loosening the prior to
  # InverseGamma(2, 4) (prior mean 4, still heavy-tailed) lets MAP find a larger amplitude, which
  # then propagates into the frozen MCMC value. Only this variant's prior changes -- the shared
  # &convex_sigma_c anchor is untouched so the adopted spec and the in-flight rollout are unaffected.
  #
  # Expected effect: decompressed OBPM peaks, higher ceilings for elite players, and LESS work for
  # the poorly-mixed nugget (ESS 5-12) since the shared component can now carry the level itself.
  nba_convex_max_tvrflvm_AR_re_sc:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: 1
      use_t_offset_re: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: {dist: InverseGamma, args: [2, 4]}
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_re_sc/map
      mcmc:
        mcmc_init: map
        model_dir:        model_output/nba_convex_max_tvrflvm_AR_re_sc/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_re_sc/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_re_sc/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_re_sc_stratified_next_k:
    model_dir: model_output/nba_convex_max_tvrflvm_AR_re_sc/stratified_next_k/map
    validation_scheme: stratified_next_k

  nba_convex_max_tvrflvm_AR_re_lin:
    m_time: 5
    basis_dims: 10
    approx_x_dim: 50
    map_num_steps: 150000
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: 1
      use_t_offset_re: 1
      use_c_linear: 1
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
