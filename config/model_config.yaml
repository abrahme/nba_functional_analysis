        model_dir:        model_output/nba_convex_max_tvrflvm_AR_re_lin/mcmc
        init_path:        model_output/nba_convex_max_tvrflvm_AR_re_lin/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_re_lin/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, lengthscale, sigma_t, sigma_c, sigma_exit_scale, sigma_W_proj, sigma_X]
        thinning: ~

  nba_convex_max_tvrflvm_AR_re_lin_stratified_next_k:
