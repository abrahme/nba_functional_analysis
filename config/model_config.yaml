    age_max: 45
    start_year: ~
    end_year: ~
    injury: true
    injury_data_csv: data/injury_player_cleaned_v2.csv
    injury_type_grouping: mechanism4
    validation_scheme: ~
    fixed_param_path: ~
    fixed_params: []
    prior_knobs:
      use_curve_re: *re_off
      use_c_offset_re: *re_off
      use_t_offset_re: *re_off
      use_injury_slope: 1
      use_injury_continuous: 1
      use_injury_decay: 1
      injury_recovery_tau: 0.75
      sigma: *convex_sigma
      sigma_X: *convex_sigma_X
      sigma_W_proj: *convex_sigma_W
      sigma_t: *convex_sigma_t
      sigma_c: *convex_sigma_c
      alpha: *alpha_per_metric
    regimes:
      map:
        model_dir: model_output/nba_convex_max_tvrflvm_AR_injury_causal_ct_sym/map
      mcmc:
        # mcmc_init MUST be median here, not map. `init_path` is the injury-free PREFIT, so a
