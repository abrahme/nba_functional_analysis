        init_path:        model_output/nba_convex_max_tvrflvm_AR_causal_sym/prefit/map/samples.pkl
        fixed_param_path: model_output/nba_convex_max_tvrflvm_AR_causal_sym/prefit/map/samples.pkl
        fixed_params: [alpha, lengthscale_deriv, sigma_c, sigma_t, t_max_raw, c_max, beta,
                       sigma_W_proj, W_proj, sigma_X, X, W, lengthscale,
                       exit, sigma_exit_scale, exit_rate,
                       rho_ar, sigma_ar, beta_ar, AR_0,
                       sigma, sigma_beta, sigma_beta_binomial, sigma_negative_binomial]
        thinning: 250

  # ═══ CONTINUOUS-TIME INJURY CAMPAIGN (v2 panels: date-based onsets + returns) ═══════════════
  # Stage 1: symmetric prefit on the v2 UNION panel (real + pseudo onsets, both censored/masked
  # at their date-based interrupted seasons). Stage 2 pair: continuous injury clock (w-gated
